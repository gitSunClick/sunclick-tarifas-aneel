name: Atualizar tarifas ANEEL no Google Sheets

on:
  # Roda sozinho a cada 3 dias (ver observação abaixo sobre o cron do
  # GitHub Actions), e também pode ser disparado a qualquer momento pelo
  # botão "⚡ SUNCLICK > 🔄 Atualizar Tarifas ANEEL" na própria planilha, ou
  # manualmente por aqui na aba Actions.
  schedule:
    # O cron do GitHub Actions só entende campos de calendário (dia do
    # mês, dia da semana), não "a cada 3 dias a partir da última vez que
    # rodou" — não existe um jeito nativo de expressar isso. "*/3" no
    # campo de dia do mês roda nos dias 1, 4, 7, 10, 13, 16, 19, 22, 25,
    # 28, 31 (e o intervalo até o dia 1 do mês seguinte pode ficar maior
    # ou menor que 3 dias, dependendo de quantos dias tem o mês) — é a
    # aproximação mais próxima de "a cada 3 dias" sem depender de nada
    # externo ao GitHub Actions. Horário: 08h de Brasília (UTC-3) = 11h
    # UTC.
    - cron: "0 11 */3 * *"
  workflow_dispatch: {}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Método de escrita: Web App do Apps Script vinculado à planilha (veja
      # apps_script/LEIA-ME.md). Não usa credencial nenhuma do Google Cloud —
      # só a URL do Web App e o token secreto definido no próprio Code.gs.
      # Sempre roda em DRY_RUN primeiro: se algo estiver estranho no preview
      # (pendências demais, ambiguidade nova), o job falha ANTES de escrever
      # na planilha real.
      - name: Dry run (preview, não escreve na planilha)
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
          GOOGLE_WORKSHEET: "TARIFAS_SUNCLICK"
          DRY_RUN: "true"
          # Sem isso, o Python faz buffering da saída (print) quando não está
          # rodando num terminal de verdade — o log do GitHub Actions fica
          # "mudo" enquanto o download dos CSVs da ANEEL (350+ MB) roda, e só
          # mostra tudo de uma vez no final. Com PYTHONUNBUFFERED=1, cada
          # print aparece em tempo real no log, então dá pra ver exatamente
          # em qual download/etapa o job está parado, se demorar.
          PYTHONUNBUFFERED: "1"
        run: python atualizar_google_sheets.py

      - name: Atualizar planilha de verdade
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
          GOOGLE_WORKSHEET: "TARIFAS_SUNCLICK"
          DRY_RUN: "false"
          PYTHONUNBUFFERED: "1"
        # A confirmação "SIM" do modo interativo é satisfeita via stdin —
        # aqui não tem ninguém pra digitar, e como o job já passou pelo dry
        # run acima sem erro, a confirmação automática é segura.
        run: echo SIM | python atualizar_google_sheets.py
